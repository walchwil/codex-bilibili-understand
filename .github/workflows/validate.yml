name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile \
            plugins/bilibili-understand/skills/bilibili-understand/scripts/probe_bilibili.py \
            plugins/bilibili-understand/skills/bilibili-understand/scripts/transcribe_audio.py
